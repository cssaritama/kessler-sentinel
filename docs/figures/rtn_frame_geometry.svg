<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="100%" height="100%" style="background:#0B0F19; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <radialGradient id="covGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.32"/>
      <stop offset="65%" stop-color="#0284C7" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.0"/>
    </radialGradient>
    <radialGradient id="satGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="chaserGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrowCyanRTN" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38BDF8"/>
    </marker>
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- =================================================================== -->
  <!-- TOP HEADER BANNER (y: 20 to 65 - Completely isolated from diagram) -->
  <!-- =================================================================== -->
  <g transform="translate(40, 25)">
    <rect x="0" y="0" width="168" height="26" rx="5" fill="#1E293B" stroke="#0284C7" stroke-width="1.2"/>
    <text x="12" y="17" fill="#38BDF8" font-size="10" font-weight="700" letter-spacing="1.0">ASTRODYNAMICS FRAME</text>
    <text x="186" y="18" fill="#F8FAFC" font-size="14" font-weight="700">Relative Orbital Geometry at TCA (RTN Coordinates)</text>
    <text x="0" y="44" fill="#94A3B8" font-size="10.5">Local-vertical / local-horizontal encounter frame centered at primary spacecraft at Time of Closest Approach</text>
  </g>

  <!-- Horizontal divider line to separate header from canvas -->
  <line x1="40" y1="80" x2="940" y2="80" stroke="#1E293B" stroke-width="1"/>

  <!-- =================================================================== -->
  <!-- COORDINATE SYSTEM CANVAS (Origin placed at x=160, y=340)            -->
  <!-- =================================================================== -->
  <g transform="translate(160, 340)">

    <!-- ----------------------------------------------------------------- -->
    <!-- AXIS 1: RADIAL (+R) VERTICAL ZENITH                               -->
    <!-- Reaches y = -180 (Canvas absolute y = 160, >80px below header)    -->
    <!-- ----------------------------------------------------------------- -->
    <line x1="0" y1="0" x2="0" y2="-180" stroke="#38BDF8" stroke-width="2.4" marker-end="url(#arrowCyanRTN)"/>
    
    <!-- Clean Pill Badge for +R Axis Label (Placed to the right of the tip) -->
    <g transform="translate(14, -200)" filter="url(#badgeShadow)">
      <rect x="0" y="0" width="130" height="26" rx="5" fill="#0C2D48" stroke="#38BDF8" stroke-width="1.2"/>
      <text x="12" y="17" fill="#38BDF8" font-size="11" font-weight="700" letter-spacing="0.5">+R : Radial Axis</text>
    </g>
    <text x="154" y="-183" fill="#E2E8F0" font-size="10" font-weight="600">[ Altitude Separation ΔR ]</text>
    <text x="18" y="-155" fill="#94A3B8" font-size="9">• Governs semi-major axis intersection</text>
    <text x="18" y="-140" fill="#64748B" font-size="8.5">• Primary collision hazard vector</text>

    <!-- ----------------------------------------------------------------- -->
    <!-- AXIS 2: TRANSVERSE / IN-TRACK (+T) HORIZONTAL VELOCITY             -->
    <!-- ----------------------------------------------------------------- -->
    <line x1="0" y1="0" x2="520" y2="0" stroke="#38BDF8" stroke-width="2.4" marker-end="url(#arrowCyanRTN)"/>
    
    <g transform="translate(540, -13)" filter="url(#badgeShadow)">
      <rect x="0" y="0" width="150" height="26" rx="5" fill="#0C2D48" stroke="#38BDF8" stroke-width="1.2"/>
      <text x="12" y="17" fill="#38BDF8" font-size="11" font-weight="700" letter-spacing="0.5">+T : Transverse (In-Track)</text>
    </g>
    <text x="548" y="28" fill="#E2E8F0" font-size="10" font-weight="600">[ Along-Track Separation ΔT ]</text>
    <text x="548" y="44" fill="#94A3B8" font-size="9">• Orbital velocity vector direction</text>
    <text x="548" y="58" fill="#64748B" font-size="8.5">• Dominant atmospheric drag uncertainty (σ_T ≫ σ_R)</text>

    <!-- ----------------------------------------------------------------- -->
    <!-- AXIS 3: NORMAL / CROSS-TRACK (+N) DEPTH NORMAL                     -->
    <!-- ----------------------------------------------------------------- -->
    <line x1="0" y1="0" x2="-75" y2="60" stroke="#38BDF8" stroke-width="2.4" marker-end="url(#arrowCyanRTN)"/>
    
    <g transform="translate(-135, 75)" filter="url(#badgeShadow)">
      <rect x="0" y="0" width="115" height="26" rx="5" fill="#0C2D48" stroke="#38BDF8" stroke-width="1.2"/>
      <text x="12" y="17" fill="#38BDF8" font-size="11" font-weight="700" letter-spacing="0.5">+N : Normal Axis</text>
    </g>
    <text x="-135" y="115" fill="#E2E8F0" font-size="10" font-weight="600">[ Cross-Track ΔN ]</text>
    <text x="-135" y="129" fill="#64748B" font-size="8.5">Orbit plane normal vector</text>

    <!-- ----------------------------------------------------------------- -->
    <!-- PRIMARY SPACECRAFT AT ORIGIN (0, 0, 0)                             -->
    <!-- ----------------------------------------------------------------- -->
    <circle cx="0" cy="0" r="16" fill="url(#satGlow)"/>
    <circle cx="0" cy="0" r="5.5" fill="#38BDF8" stroke="#FFFFFF" stroke-width="1.8"/>
    <g transform="translate(-25, 22)">
      <rect x="0" y="0" width="160" height="24" rx="4" fill="#1E293B" stroke="#475569" stroke-width="1"/>
      <text x="12" y="16" fill="#F8FAFC" font-size="10" font-weight="700">Primary Satellite (0, 0, 0)</text>
    </g>

    <!-- ----------------------------------------------------------------- -->
    <!-- CHASER OBJECT & COVARIANCE DISPERSION ELLIPSOID                    -->
    <!-- Encounter Position: dT = 320m, dR = -80m                           -->
    <!-- ----------------------------------------------------------------- -->
    <g transform="translate(320, -80)">
      <!-- 3D Covariance Dispersion Ellipse (along-track elongation) -->
      <ellipse cx="0" cy="0" rx="160" ry="40" fill="url(#covGrad)" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="6,4"/>
      <ellipse cx="0" cy="8" rx="155" ry="36" fill="none" stroke="#0284C7" stroke-width="0.8" stroke-dasharray="3,3" opacity="0.6"/>

      <!-- Chaser Core Point with Red Glow Indicator -->
      <circle cx="0" cy="0" r="15" fill="url(#chaserGlow)"/>
      <circle cx="0" cy="0" r="5.5" fill="#EF4444" stroke="#FFFFFF" stroke-width="2"/>

      <!-- Chaser Object Badge (Pill above point) -->
      <g transform="translate(-80, -56)" filter="url(#badgeShadow)">
        <rect x="0" y="0" width="160" height="28" rx="5" fill="#1E1B4B" stroke="#A855F7" stroke-width="1.4"/>
        <circle cx="16" cy="14" r="4" fill="#EF4444"/>
        <text x="28" y="18" fill="#F8FAFC" font-size="10.5" font-weight="700">Chaser Object (*)</text>
      </g>

      <!-- Covariance Ellipsoid Spec Tag (Cleanly positioned below ellipse) -->
      <g transform="translate(-120, 52)">
        <rect x="0" y="0" width="240" height="36" rx="5" fill="#0E1726" stroke="#1E293B" stroke-width="1.2"/>
        <text x="14" y="16" fill="#38BDF8" font-size="9.5" font-weight="700">Covariance Ellipsoid: σ_T ≫ σ_R</text>
        <text x="14" y="30" fill="#94A3B8" font-size="8.5">Thermospheric drag inflates along-track uncertainty</text>
      </g>

      <!-- Miss Distance Vector from Origin to Chaser -->
      <line x1="-320" y1="80" x2="0" y2="0" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="4,4"/>
    </g>

    <!-- Miss Distance Label on Vector -->
    <g transform="translate(110, -22)" filter="url(#badgeShadow)">
      <rect x="0" y="0" width="135" height="22" rx="4" fill="#1C1917" stroke="#F59E0B" stroke-width="1"/>
      <text x="10" y="15" fill="#F59E0B" font-size="9" font-weight="700">Miss Distance |d| at TCA</text>
    </g>

    <!-- Coordinate Projection Helper Guides -->
    <!-- Along-Track (ΔT) Guide -->
    <line x1="0" y1="56" x2="320" y2="56" stroke="#475569" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="0" y1="50" x2="0" y2="62" stroke="#475569" stroke-width="1.4"/>
    <line x1="320" y1="50" x2="320" y2="62" stroke="#475569" stroke-width="1.4"/>
    <text x="160" y="72" fill="#94A3B8" font-size="9.5" font-weight="600" text-anchor="middle">Along-Track Separation (ΔT)</text>

    <!-- Radial Separation (ΔR) Guide on the Left -->
    <line x1="-48" y1="0" x2="-48" y2="-80" stroke="#475569" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="-54" y1="0" x2="-42" y2="0" stroke="#475569" stroke-width="1.4"/>
    <line x1="-54" y1="-80" x2="-42" y2="-80" stroke="#475569" stroke-width="1.4"/>
    <text x="-58" y="-36" fill="#94A3B8" font-size="9.5" font-weight="600" text-anchor="end">Radial (ΔR)</text>

  </g>
</svg>